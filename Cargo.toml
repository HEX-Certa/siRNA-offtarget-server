[package]
name = "sirna-offtarget-checker"
version = "0.1.0"
edition = "2021"
description = "Human RefSeq transcriptome siRNA off-target checker (T6b)"

[dependencies]
anyhow = "1"
axum = "0.8"
hex = "0.4"
rayon = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
